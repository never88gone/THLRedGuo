name: Build Flutter Apps (Android, iOS, macOS, Windows)

on:
  push:
    branches: [main, master]
    tags: ['v*']
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'android/**'
      - 'ios/**'
      - 'macos/**'
      - 'windows/**'
      - 'packages/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'scripts/**'
      - '.github/workflows/build-flutter.yml'
  pull_request:
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'android/**'
      - 'ios/**'
      - 'macos/**'
      - 'windows/**'
      - 'packages/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'scripts/**'
      - '.github/workflows/build-flutter.yml'
  workflow_dispatch:
    inputs:
      target_platform:
        description: '选择需要打包的平台（默认全部 Flutter 平台）'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - android
          - windows
          - macos
          - ios

permissions:
  contents: write

concurrency:
  group: flutter-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android 平台自动化打包
    if: inputs.target_platform == null || inputs.target_platform == 'all' || inputs.target_platform == 'android'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: 安装 Android SDK 与 NDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 ndk;28.2.13676358"
          accept-android-sdk-licenses: true
      - name: 配置 Android 发布签名
        id: signing
        run: |
          python scripts/configure_signing.py
          if [ -f android/key.properties ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置发布签名 Secrets，本次 APK 使用 debug 签名，仅供测试。"
          fi
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: 构建 Android APK
        run: python scripts/build_android.py
      - name: 校验 APK 签名证书
        if: steps.signing.outputs.release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ vars.ANDROID_CERT_SHA256 }}'
          if [ -z "$expected" ]; then
            echo "未设置仓库变量 ANDROID_CERT_SHA256，跳过证书指纹比对。" >&2
            exit 0
          fi
          apksigner=$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f 2>/dev/null | sort | tail -n1 || true)
          if [ -z "$apksigner" ]; then
            sdkmanager 'build-tools;35.0.0' >/dev/null
            apksigner=$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f | sort | tail -n1)
          fi
          echo "apksigner：$apksigner"
          "$apksigner" --version || true
          for apk in dist/android/*.apk; do
            echo "== $(basename "$apk")"
            output=$("$apksigner" verify --print-certs "$apk" 2>&1 || true)
            printf '%s\n' "$output"
            if ! printf '%s' "$output" | tr -d ':' | tr '[:upper:]' '[:lower:]' | grep -q "$expected"; then
              echo "签名证书与发布证书不一致，已终止。" >&2
              exit 1
            fi
          done
      - name: 清理临时签名凭证
        if: always()
        run: python scripts/configure_signing.py --clean
      - name: 上传 Android 安装包
        uses: actions/upload-artifact@v4
        with:
          name: android-packages
          path: dist/android/*
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows 平台自动化打包
    if: inputs.target_platform == null || inputs.target_platform == 'all' || inputs.target_platform == 'windows'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: 开启 Windows 桌面支持
        run: flutter config --enable-windows-desktop
      - name: 检查 Windows 构建环境
        run: flutter doctor -v
      - name: 构建 Windows 便携包
        run: python scripts/build_windows.py
      - name: 上传 Windows 安装包
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: dist/windows/*
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS 平台自动化打包
    if: inputs.target_platform == null || inputs.target_platform == 'all' || inputs.target_platform == 'ios'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: 开启 iOS 支持
        run: flutter config --enable-ios
      - name: 配置 iOS 发布签名环境
        id: signing
        env:
          CERT_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 || vars.APPLE_CERTIFICATE_P12_BASE64 }}
          CERT_PWD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD || vars.APPLE_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 || vars.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          CERT_LEN=${#CERT_BASE64}
          PWD_LEN=${#CERT_PWD}
          PROFILE_LEN=${#PROFILE_BASE64}
          echo "==== 诊断 iOS 签名凭证配置 ===="
          echo "  - APPLE_CERTIFICATE_P12_BASE64: $( [ $CERT_LEN -gt 0 ] && echo "已配置 ($CERT_LEN 字符)" || echo "❌ 未配置或为空" )"
          echo "  - APPLE_CERTIFICATE_PASSWORD: $( [ $PWD_LEN -gt 0 ] && echo "已配置" || echo "❌ 未配置或为空" )"
          echo "  - IOS_PROVISION_PROFILE_BASE64: $( [ $PROFILE_LEN -gt 0 ] && echo "已配置 ($PROFILE_LEN 字符)" || echo "❌ 未配置或为空" )"
          echo "================================"

          if [ -n "$CERT_BASE64" ] && [ -n "$CERT_PWD" ]; then
            echo "has_signing=true" >> "$GITHUB_OUTPUT"
            security create-keychain -p "ci_temporal_pwd" build.keychain
            security default-keychain -s build.keychain
            security unlock-keychain -p "ci_temporal_pwd" build.keychain
            security set-keychain-settings -lut 21600 build.keychain

            echo "$CERT_BASE64" | base64 --decode > cert.p12
            security import cert.p12 -k build.keychain -P "$CERT_PWD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "ci_temporal_pwd" build.keychain
            rm -f cert.p12

            if [ -n "$PROFILE_BASE64" ]; then
              mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
              echo "$PROFILE_BASE64" | base64 --decode > /tmp/profile.mobileprovision
              UUID=$(security cms -D -i /tmp/profile.mobileprovision 2>/dev/null | grep -A1 '<key>UUID</key>' | grep '<string>' | sed -E 's/.*<string>(.*)<\/string>.*/\1/' || true)
              if [ -n "$UUID" ]; then
                cp /tmp/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/${UUID}.mobileprovision
              fi
              cp /tmp/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/thlredlook_iOS_dis.mobileprovision
              cp /tmp/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/ios_appstore.mobileprovision
              rm -f /tmp/profile.mobileprovision
            fi
          else
            echo "has_signing=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置 iOS 签名证书 Secrets，本次构建仅生成未签名发布包。"
          fi
      - name: 构建 iOS 应用安装包
        run: |
          if [ "${{ steps.signing.outputs.has_signing }}" = "true" ] && [ -f ios/ExportOptions.plist ]; then
            python scripts/build_ios.py --export-options ios/ExportOptions.plist
          else
            python scripts/build_ios.py
          fi
      - name: 上传 iOS 至 App Store Connect (TestFlight)
        env:
          HAS_SIGNING: ${{ steps.signing.outputs.has_signing }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID || vars.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID || vars.APP_STORE_CONNECT_ISSUER_ID }}
          PRIVATE_KEY_B64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY || vars.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          if [ "$HAS_SIGNING" != "true" ]; then
            echo "::warning::【未配置签名证书】未检测到 APPLE_CERTIFICATE_P12_BASE64，已跳过 TestFlight 上传。"
            exit 0
          fi
          if [ -z "$KEY_ID" ] || [ -z "$ISSUER_ID" ] || [ -z "$PRIVATE_KEY_B64" ]; then
            echo "::warning::【未配置 API 密钥】未检测到 APP_STORE_CONNECT_* Secrets，已跳过 TestFlight 上传。"
            exit 0
          fi
          mkdir -p ~/.appstoreconnect/private_keys
          if [[ "$PRIVATE_KEY_B64" == *"BEGIN PRIVATE KEY"* ]]; then
            echo "$PRIVATE_KEY_B64" > ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
          else
            echo "$PRIVATE_KEY_B64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
          fi
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
          signed_ipa=$(find dist/ios -type f \( -name "*ios.ipa" -o -name "*signed.ipa" \) ! -name "*unsigned*" | head -n1)
          if [ -n "$signed_ipa" ] && [ -f "$signed_ipa" ]; then
            echo "正在上传 iOS 签名包到 App Store Connect: $signed_ipa"
            xcrun altool --upload-app -f "$signed_ipa" -t ios --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"
            echo "✅ iOS 版本成功上传到 App Store Connect！"
            python scripts/set_testflight_notes.py || true
          else
            echo "::error::未发现签名的 iOS IPA 产物，无法上传。"
            exit 1
          fi
      - name: 清理 iOS 钥匙串与临时凭证
        if: always()
        run: |
          security delete-keychain build.keychain 2>/dev/null || true
          rm -rf ~/.appstoreconnect
      - name: 上传 iOS 安装包
        uses: actions/upload-artifact@v4
        with:
          name: ios-packages
          path: dist/ios/*
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS 平台自动化打包
    if: inputs.target_platform == null || inputs.target_platform == 'all' || inputs.target_platform == 'macos'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: 开启 macOS 桌面支持
        run: flutter config --enable-macos-desktop
      - name: 配置 macOS 发布签名环境
        id: signing
        env:
          CERT_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 || vars.APPLE_CERTIFICATE_P12_BASE64 }}
          CERT_PWD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD || vars.APPLE_CERTIFICATE_PASSWORD }}
          INSTALLER_CERT_BASE64: ${{ secrets.MAC_INSTALLER_CERTIFICATE_P12_BASE64 || vars.MAC_INSTALLER_CERTIFICATE_P12_BASE64 }}
          INSTALLER_CERT_PWD: ${{ secrets.MAC_INSTALLER_CERTIFICATE_PASSWORD || secrets.APPLE_CERTIFICATE_PASSWORD || vars.APPLE_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.MACOS_PROVISION_PROFILE_BASE64 || vars.MACOS_PROVISION_PROFILE_BASE64 }}
        run: |
          CERT_LEN=${#CERT_BASE64}
          PWD_LEN=${#CERT_PWD}
          INSTALLER_LEN=${#INSTALLER_CERT_BASE64}
          PROFILE_LEN=${#PROFILE_BASE64}
          echo "==== 诊断 macOS 签名凭证配置 ===="
          echo "  - APPLE_CERTIFICATE_P12_BASE64: $( [ $CERT_LEN -gt 0 ] && echo "已配置 ($CERT_LEN 字符)" || echo "❌ 未配置或为空" )"
          echo "  - APPLE_CERTIFICATE_PASSWORD: $( [ $PWD_LEN -gt 0 ] && echo "已配置" || echo "❌ 未配置或为空" )"
          echo "  - MAC_INSTALLER_CERTIFICATE_P12_BASE64: $( [ $INSTALLER_LEN -gt 0 ] && echo "已配置 ($INSTALLER_LEN 字符)" || echo "⚠️ 未配置（仅生成本地签名 App，上传 TestFlight 需配置）" )"
          echo "  - MACOS_PROVISION_PROFILE_BASE64: $( [ $PROFILE_LEN -gt 0 ] && echo "已配置 ($PROFILE_LEN 字符)" || echo "❌ 未配置或为空" )"
          echo "================================"

          if [ -n "$CERT_BASE64" ] && [ -n "$CERT_PWD" ]; then
            echo "has_signing=true" >> "$GITHUB_OUTPUT"
            security create-keychain -p "ci_temporal_pwd" build.keychain
            security default-keychain -s build.keychain
            security unlock-keychain -p "ci_temporal_pwd" build.keychain
            security set-keychain-settings -lut 21600 build.keychain

            echo "$CERT_BASE64" | base64 --decode > cert.p12
            security import cert.p12 -k build.keychain -P "$CERT_PWD" -T /usr/bin/codesign -T /usr/bin/productbuild
            rm -f cert.p12

            if [ -n "$INSTALLER_CERT_BASE64" ]; then
              echo "$INSTALLER_CERT_BASE64" | base64 --decode > installer.p12
              security import installer.p12 -k build.keychain -P "$INSTALLER_CERT_PWD" -T /usr/bin/codesign -T /usr/bin/productbuild
              rm -f installer.p12
            fi

            security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild: -s -k "ci_temporal_pwd" build.keychain

            if [ -n "$PROFILE_BASE64" ]; then
              mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
              echo "$PROFILE_BASE64" | base64 --decode > /tmp/profile.provisionprofile
              UUID=$(security cms -D -i /tmp/profile.provisionprofile 2>/dev/null | grep -A1 '<key>UUID</key>' | grep '<string>' | sed -E 's/.*<string>(.*)<\/string>.*/\1/' || true)
              if [ -n "$UUID" ]; then
                cp /tmp/profile.provisionprofile ~/Library/MobileDevice/Provisioning\ Profiles/${UUID}.provisionprofile
              fi
              cp /tmp/profile.provisionprofile ~/Library/MobileDevice/Provisioning\ Profiles/thlredlook_macOS_dis.provisionprofile
              cp /tmp/profile.provisionprofile ~/Library/MobileDevice/Provisioning\ Profiles/macos_appstore.provisionprofile
              rm -f /tmp/profile.provisionprofile
            fi
          else
            echo "has_signing=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置 macOS 签名证书 Secrets，本次构建仅生成未签名发布包。"
          fi
      - name: 构建并打包 macOS DMG 安装包
        run: |
          python scripts/build_macos.py
      - name: 清理 macOS 钥匙串与临时凭证
        if: always()
        run: |
          security delete-keychain build.keychain 2>/dev/null || true
          rm -rf ~/.appstoreconnect
      - name: 上传 macOS 安装包
        uses: actions/upload-artifact@v4
        with:
          name: macos-packages
          path: dist/macos/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Flutter 跨平台产物汇总与 Release 发布
    needs: [android, windows, ios, macos]
    if: always() && github.event_name != 'pull_request' && (needs.android.result == 'success' || needs.windows.result == 'success' || needs.macos.result == 'success' || needs.ios.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 生成发布文件清单与校验和
        run: |
          set -euo pipefail
          mkdir -p release
          # 收集所有已构建平台的发布产物（Android APK、Windows Zip、macOS DMG、iOS IPA 等）
          for directory in artifacts/*/; do
            [ -d "$directory" ] || continue
            dirname=$(basename "$directory")
            echo "正在处理产物目录: $dirname"
            for file in "$directory"*; do
              [ -f "$file" ] || continue
              name=$(basename "$file")
              if [ "$name" = "SHA256SUMS.txt" ]; then
                continue
              fi
              cp "$file" "release/$name"
              echo "  已纳入发布文件: $name"
            done
          done
          cd release
          mapfile -t files < <(find . -maxdepth 1 -type f -printf '%f\n' | sort)
          if [ ${#files[@]} -eq 0 ]; then
            echo "未发现任何发布产物，请检查打包日志。" >&2
            exit 1
          fi
          sha256sum "${files[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: 自动创建或更新 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${{ github.ref_name }}"
            base_version="${tag#v}"
          else
            version=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n1)
            base_version="${version%%+*}"
            tag="v${base_version}"
          fi
          
          # 从生成产物中提取实际构建号
          sample_pkg=$(find release -maxdepth 1 \( -name "THLRedLook-*.apk" -o -name "THLRedLook-*.zip" -o -name "THLRedLook-*.dmg" \) | head -n1)
          if [ -n "$sample_pkg" ]; then
            latest_build=$(basename "$sample_pkg" | grep -oE '\+[0-9]+' | tr -d '+' || echo "")
          else
            latest_build=""
          fi
          if [ -z "$latest_build" ]; then
            latest_build=$(TZ='Asia/Shanghai' date '+%y%j%H%M')
          fi
          bj_time=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M')

          # 如果已存在该 Release，安全清理本次被替换平台的历史旧包（防止历史过期安装包堆积）
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "正在同步清理历史同名平台过期安装包..."
            existing_assets=$(gh release view "$tag" --json assets --jq '.assets[].name' || true)
            for new_file in release/*; do
              [ -f "$new_file" ] || continue
              fname=$(basename "$new_file")
              [ "$fname" = "SHA256SUMS.txt" ] && continue
              suffix=$(echo "$fname" | sed -E 's/.*THLRedLook-[0-9.]+[^-\.]*-(.*)/\1/')
              if [ -n "$suffix" ] && [ "$suffix" != "$fname" ]; then
                for old_asset in $existing_assets; do
                  if [[ "$old_asset" == *"$suffix" ]] && [ "$old_asset" != "$fname" ]; then
                    echo "清理过期旧包: $old_asset"
                    gh release delete-asset "$tag" "$old_asset" -y || true
                  fi
                done
              fi
            done
          fi

          # 动态生成包含直接下载直链与精准北京时间戳的 Release Notes
          repo="${{ github.repository }}"
          base_url="https://github.com/${repo}/releases/download/${tag}"
          
          {
            printf '%s\n\n' "## 糖葫芦Haw (THLRedLook) v${base_version} 正式发布"
            printf '> 🕒 **最近滚动更新**：%s (北京时间) · **最新构建号**：`Build %s` · **Git 提交**：`%s`\n' "$bj_time" "$latest_build" "${{ github.sha }}"
            printf '> 💡 *本项目采用持续集成，每次提交均自动构建各端安装包并更新发布。若页面缓存显示较早时间，请以本说明和安装包构建号为准。*\n\n'
            printf '%s\n\n' "全平台独立运行的短剧与流媒体聚合播放器，内置官方标准规范的数据源，支持端侧独立解析与在线播放。无需注册登录，开箱即用。"
            printf '%s\n\n' "### 📦 最新跨平台安装包直接下载（Build ${latest_build}）"
            
            # 列出 Android 安装包直链
            printf '%s\n' "#### 📱 Android (手机 / 平板 / 电视盒子)"
            for f in release/*-arm64-v8a.apk release/*-armeabi-v7a.apk release/*-x86_64.apk; do
              if [ -f "$f" ]; then
                fn=$(basename "$f")
                encoded_fn=$(echo "$fn" | sed 's/+/%2B/g')
                desc="常规安装包"
                [[ "$fn" == *"arm64-v8a"* ]] && desc="绝大多数现代 64 位手机与平板设备（**推荐**）"
                [[ "$fn" == *"armeabi-v7a"* ]] && desc="较老的 32 位手机或部分电视盒子"
                [[ "$fn" == *"x86_64"* ]] && desc="PC 端 Android 模拟器"
                printf -- '- [%s](%s/%s)（%s）\n' "$fn" "$base_url" "$encoded_fn" "$desc"
              fi
            done
            
            # 列出 Windows 安装包直链
            printf '\n%s\n' "#### 🖥️ Windows (桌面端)"
            for f in release/*-windows-x64.zip; do
              if [ -f "$f" ]; then
                fn=$(basename "$f")
                encoded_fn=$(echo "$fn" | sed 's/+/%2B/g')
                printf -- '- [%s](%s/%s)（Windows 10 / 11 64 位绿色免安装便携版，解压后直接双击运行主程序，支持专属 Shader 滤镜画质增强）\n' "$fn" "$base_url" "$encoded_fn"
              fi
            done

            # 列出 macOS 安装包直链
            printf '\n%s\n' "#### 💻 macOS (Mac 电脑)"
            for f in release/*-macos.dmg; do
              if [ -f "$f" ]; then
                fn=$(basename "$f")
                encoded_fn=$(echo "$fn" | sed 's/+/%2B/g')
                printf -- '- [%s](%s/%s)（macOS 原生磁盘映像安装包，双击打开后拖拽至 Applications 即可安装）\n' "$fn" "$base_url" "$encoded_fn"
              fi
            done

            # 列出 iOS 安装包直链
            printf '\n%s\n' "#### 🍏 iOS (iPhone / iPad)"
            for f in release/*-ios*.ipa; do
              if [ -f "$f" ]; then
                fn=$(basename "$f")
                encoded_fn=$(echo "$fn" | sed 's/+/%2B/g')
                printf -- '- [%s](%s/%s)（iOS 离线安装包，可通过 AltStore / Sideloadly / TrollStore / 爱思助手直接自签安装）\n' "$fn" "$base_url" "$encoded_fn"
              fi
            done
            printf -- '- **官方 TestFlight 公测**：[立即加入 TestFlight 公测 (iOS / iPadOS / tvOS)](https://testflight.apple.com/join/rkvvdp7J)\n'

            # 保持 tvOS 链接说明
            printf '\n%s\n' "#### 📺 Apple tvOS (大屏原生客厅端)"
            printf -- '- [THLRedLook-1.0.0-tvos-signed.ipa](%s/THLRedLook-1.0.0-tvos-signed.ipa)（已签名 tvOS 原生大屏安装包）\n' "$base_url"
            printf -- '- [THLRedLook-1.0.0-tvos-unsigned.ipa](%s/THLRedLook-1.0.0-tvos-unsigned.ipa)（tvOS 未签名自签包）\n' "$base_url"

            printf '\n%s\n' "---"
            printf '%s\n' "### 🔒 安全校验与哈希"
            printf '本次发布产物的完整性哈希已记录于 [SHA256SUMS.txt](%s/SHA256SUMS.txt)。\n' "$base_url"
          } > notes.md

          # 上传与更新 Release
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "更新已有 Release: $tag"
            gh release upload "$tag" release/* --clobber
            gh release edit "$tag" --title "糖葫芦Haw v${base_version} (Build ${latest_build})" --notes-file notes.md --target "${{ github.sha }}"
          else
            echo "创建新 Release: $tag (Target: ${{ github.sha }})"
            gh release create "$tag" release/* \
              --title "糖葫芦Haw v${base_version} (Build ${latest_build})" \
              --notes-file notes.md \
              --target "${{ github.sha }}"
          fi
