name: THLRedLook
description: 独立运行的多端短剧应用
publish_to: none
version: 1.0.0+202611071326

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  video_player: ^2.9.2
  ffi: ^2.2.0
  media_kit: 1.2.6
  media_kit_video: 2.0.1
  media_kit_libs_video: ^1.0.7
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.5
  flutter_foreground_task: 11.0.3
  ffmpeg_kit_flutter_new_min_gpl: 2.6.2
  file_picker: 13.1.0
  crypto: ^3.0.7
  window_manager: ^0.5.1
  nsd: 5.0.1
  package_info_plus: ^10.2.1
  wakelock_plus: ^1.8.1
  http: ^1.6.0
  html: ^0.15.7
  flutter_js: ^0.8.7
  url_launcher: ^6.3.3
  flutter_secure_storage: ^11.2.0
  qr_flutter: ^4.1.0
  cryptography: ^2.9.0
  mobile_scanner: ^7.5.0
  gal: ^2.3.3
  flutter_inappwebview: 6.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2
  video_player_platform_interface: ^6.9.0

dependency_overrides:
  media_kit_libs_windows_video:
    path: packages/media_kit_libs_windows_video

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - assets/video_enhancement/
    - assets/branding/
    - path: assets/sources/hongguo.js
      transformers:
        - package: tool/prepare_local_debug_source.dart
